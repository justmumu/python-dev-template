name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    outputs:
      generated: ${{ steps.project.outputs.generated }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Select integration owner
        id: project
        run: |
          if [ -f copier.yml ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Shared formatting and lint
        run: make check-static
      - name: Strict documentation build
        run: make docs-build
      - name: Python 3.13 typing and unit tests
        run: make check-python
      # Pull requests also cover the older supported versions; main re-checks 3.13 only.
      - name: Python 3.12 typing and unit tests
        if: github.event_name == 'pull_request'
        env:
          UV_PYTHON: "3.12"
        run: |
          uv python install "$UV_PYTHON"
          make install
          make check-python
      - name: Python 3.11 typing and unit tests
        if: github.event_name == 'pull_request'
        env:
          UV_PYTHON: "3.11"
        run: |
          uv python install "$UV_PYTHON"
          make install
          make check-python

  integration:
    name: integration
    needs: check
    if: needs.check.outputs.generated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Real tool, release and documentation scenarios
        run: make test-integration
